data:
  raw_path: data/raw/water_quality.csv
  processed_path: data/processed/water_quality_clean.csv

target:
  variable: water_pH

model:
  test_size: 0.2
  random_state: 42

features:
  use_lags: true
  lags: [1, 3, 6]
  use_rolling_features: true
  rolling_window: 3

paths:
  models_dir: models
  figures_dir: results/figures
  tables_dir: results/tables
  predictions_dir: results/predictions
